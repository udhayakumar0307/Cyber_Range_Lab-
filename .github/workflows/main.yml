name: Sync to Fork

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push changes to fork
        env:
          FORK_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          # Clear any leftover default authorization headers set by actions/checkout
          git config --local --unset-all http.https://github.com/.extraheader || true
          
          # Add remote and push using the PAT
          git remote add fork https://x-access-token:${FORK_TOKEN}@github.com/umadhatri/Cyber_Range_Lab-.git
          git push fork main --force
