listen=YES
listen_ipv6=NO
anonymous_enable=YES
local_enable=YES
write_enable=NO
anon_root=/var/ftp
no_anon_password=YES
hide_ids=NO
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# Intentionally verbose banner (information disclosure)
ftpd_banner=TechCorp FTP Server v2.0 - Ubuntu vsftpd/3.0.5
