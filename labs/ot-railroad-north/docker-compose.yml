# ============================================================
# LAB: OT RAILROAD NORTH ATTACK
# IronTrack Security Assessment - NorthRail Transit Authority
# ============================================================
# Usage:
#   docker-compose up --build -d
#   Then: docker exec -it lab-ot-rail-student bash
# ============================================================

networks:
  ot-rail-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
  dmz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

services:

  # -- Vulnerable Services: Master PLC -------------------------
  master-plc:
    image: python:3.11-slim
    container_name: lab-ot-rail-master-plc
    hostname: master-plc
    networks:
      ot-rail-net:
        ipv4_address: 172.25.0.10
    ports:
      - "8085:8080"
      - "5020:502"
    volumes:
      - ./vulnerable-services/master-plc:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install flask flask-cors pymodbus && python /app/master_plc.py"
    restart: unless-stopped

  # -- Slave PLCs -----------------------------------------------
  slave-plc-1:
    image: python:3.11-slim
    container_name: lab-ot-rail-slave-1
    hostname: slave-plc-1
    networks:
      ot-rail-net:
        ipv4_address: 172.25.1.10
    volumes:
      - ./vulnerable-services/slave-plc:/app
    environment:
      - SEGMENT_ID=1
      - SEGMENT_NAME=North (Entrance)
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install flask flask-cors pymodbus && python /app/slave_plc.py"
    restart: unless-stopped

  slave-plc-2:
    image: python:3.11-slim
    container_name: lab-ot-rail-slave-2
    hostname: slave-plc-2
    networks:
      ot-rail-net:
        ipv4_address: 172.25.2.10
    volumes:
      - ./vulnerable-services/slave-plc:/app
    environment:
      - SEGMENT_ID=2
      - SEGMENT_NAME=Central (Junction)
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install flask flask-cors pymodbus && python /app/slave_plc.py"
    restart: unless-stopped

  slave-plc-3:
    image: python:3.11-slim
    container_name: lab-ot-rail-slave-3
    hostname: slave-plc-3
    networks:
      ot-rail-net:
        ipv4_address: 172.25.3.10
    volumes:
      - ./vulnerable-services/slave-plc:/app
    environment:
      - SEGMENT_ID=3
      - SEGMENT_NAME=South (Yard)
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install flask flask-cors pymodbus && python /app/slave_plc.py"
    restart: unless-stopped

  # -- SCADA Dashboard ------------------------------------------
  scada:
    image: python:3.11-slim
    container_name: lab-ot-rail-scada
    hostname: scada
    networks:
      ot-rail-net:
      dmz-net:
        ipv4_address: 172.27.0.10
    ports:
      - "8081:8080"
    volumes:
      - ./vulnerable-services/scada:/app
    environment:
      - MASTER_PLC_IP=172.25.0.10
      - PYTHONUNBUFFERED=1
    command: >
      bash -c "pip install flask flask-cors requests && python /app/scada_server.py"
    depends_on:
      - master-plc
    restart: unless-stopped

  # -- Wireshark ------------------------------------------------
  wireshark:
    image: lscr.io/linuxserver/wireshark:latest
    container_name: lab-ot-rail-wireshark
    network_mode: "service:master-plc"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    ports:
      - "3001:3000"
    restart: unless-stopped

  # -- Student Workspace ----------------------------------------
  student-env:
    build: ./student-env
    container_name: lab-ot-rail-student
    hostname: irontrack-kali
    networks:
      ot-rail-net:
        ipv4_address: 172.25.0.50
    environment:
      - TARGET_IP=172.25.0.10
      - SCORING_URL=http://172.25.0.99:5000
    volumes:
      - ./modules:/modules:ro
    depends_on:
      - master-plc
      - scoring-server
    stdin_open: true
    tty: true

  # -- Scoring Server -------------------------------------------
  scoring-server:
    build: ./scoring-server
    container_name: lab-ot-rail-scoring
    hostname: scoring
    networks:
      ot-rail-net:
        ipv4_address: 172.25.0.99
    ports:
      - "5000:5000"
    volumes:
      - scoring-data:/data
      - ./modules:/app/static/modules:ro
    restart: unless-stopped

volumes:
  scoring-data:
