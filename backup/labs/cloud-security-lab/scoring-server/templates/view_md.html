<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Range | Module Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background: #F8FAFC; font-family: 'Inter', system-ui, sans-serif; }

    /* Markdown content styling — platform light theme */
    #md-content h1 { font-size: 1.6rem; font-weight: 800; color: #0F172A; border-bottom: 2px solid #E5E7EB; padding-bottom: 10px; margin: 0 0 20px 0; }
    #md-content h2 { font-size: 1.15rem; font-weight: 700; color: #1E293B; margin: 28px 0 12px 0; }
    #md-content h3 { font-size: 1rem; font-weight: 600; color: #334155; margin: 20px 0 8px 0; }
    #md-content p  { color: #475569; line-height: 1.7; margin-bottom: 14px; font-size: 0.92rem; }
    #md-content ul, #md-content ol { padding-left: 22px; margin-bottom: 16px; color: #475569; font-size: 0.92rem; }
    #md-content li { margin-bottom: 6px; line-height: 1.65; }
    #md-content a  { color: #2563EB; text-decoration: none; }
    #md-content a:hover { text-decoration: underline; }
    #md-content code {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      padding: 2px 6px;
      border-radius: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: #1E293B;
    }
    #md-content pre {
      background: #0B1020;
      border: 1px solid #1E293B;
      border-radius: 12px;
      padding: 16px 20px;
      margin: 16px 0;
      overflow-x: auto;
    }
    #md-content pre code {
      display: block;
      background: transparent;
      border: none;
      padding: 0;
      color: #00FF9D;
      font-size: 0.85rem;
      line-height: 1.6;
    }
    #md-content blockquote {
      border-left: 3px solid #2563EB;
      background: #EFF6FF;
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      margin: 16px 0;
      color: #1E40AF;
      font-size: 0.9rem;
    }
    #md-content hr { border: none; border-top: 1px solid #E5E7EB; margin: 24px 0; }
    #md-content strong { font-weight: 700; color: #0F172A; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen bg-[#F8FAFC] text-slate-900 antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-[#E5E7EB] sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <button onclick="history.back()"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-all cursor-pointer">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Back to Lab
        </button>
        <div class="h-4 w-px bg-slate-200 hidden sm:block"></div>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-[#2563EB] border border-blue-200">
          📖 Module Guide
        </span>
      </div>
      <span class="text-xs font-semibold text-slate-500 hidden sm:block">Cloud Security Lab · Cyber Range Platform</span>
    </div>
  </header>

  <!-- Main content -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-8">
    <div class="bg-white border border-[#E5E7EB] rounded-2xl shadow-sm p-8 sm:p-10" id="md-content">
      <!-- Loading state -->
      <div id="loading-state" class="flex items-center gap-3 text-slate-400 py-8">
        <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
        </svg>
        <span class="text-sm font-medium">Loading module guide…</span>
      </div>
    </div>
  </main>

  <script>
    // Fetch the raw markdown from the /modules/raw/<filename> endpoint
    const filename = "{{ filename }}";
    fetch(`/modules/raw/${encodeURIComponent(filename)}`)
      .then(res => {
        if (!res.ok) throw new Error("File not found");
        return res.text();
      })
      .then(text => {
        const mdContent = document.getElementById('md-content');
        mdContent.innerHTML = marked.parse(text);
      })
      .catch(err => {
        const mdContent = document.getElementById('md-content');
        mdContent.innerHTML = `
          <div class="text-center py-12 space-y-3">
            <div class="w-12 h-12 bg-rose-50 border border-rose-200 rounded-xl flex items-center justify-center mx-auto text-rose-500 text-xl">⚠</div>
            <h2 class="text-base font-bold text-slate-800">Could not load guide</h2>
            <p class="text-sm text-slate-500">The module guide document could not be found. Check that <code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs">${filename}</code> exists.</p>
            <button onclick="history.back()" class="mt-4 px-4 py-2 bg-[#2563EB] text-white text-xs font-bold rounded-lg cursor-pointer hover:bg-blue-700 transition-all">← Back to Lab</button>
          </div>
        `;
      });
  </script>
</body>
</html>
