<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryptography Wargame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#080b11; --surface:#111823; --surface2:#0c121b; --surface3:#0e1520;
    --line:#1c2836; --line2:#243546;
    --fg:#e6edf5; --muted:#8695a8; --faint:#5a6a7d;
    --green:#3fdd97; --blue:#5aa2ff; --amber:#ffcf5c; --orange:#ff9f45; --red:#ff6b6b;
    --ui:'Inter',system-ui,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --head:56px; --radius:12px;
    --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.55;overflow:hidden;
       -webkit-font-smoothing:antialiased}
  ::selection{background:rgba(90,162,255,.3)}
  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#1d2a39;border-radius:8px;border:2px solid var(--surface2)}
  ::-webkit-scrollbar-thumb:hover{background:#28394d}

  /* ---------- header ---------- */
  header{height:var(--head);display:flex;align-items:center;gap:14px;padding:0 20px;
    background:linear-gradient(180deg,#0e151e,#0a0f16);border-bottom:1px solid var(--line);position:relative;z-index:5}
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;
    background:linear-gradient(135deg,#123b2b,#0e2540);border:1px solid var(--line2);box-shadow:inset 0 0 12px rgba(63,221,151,.15)}
  .brand h1{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.3px}
  .brand .sub{font-size:11px;color:var(--faint);font-weight:500;letter-spacing:.4px}
  .spacer{flex:1}
  .ring{display:flex;align-items:center;gap:10px}
  .ring svg{transform:rotate(-90deg)}
  .ring .lbl{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .ring .lbl b{color:var(--fg);font-size:13px}
  .chip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 12px}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .chip b{color:var(--fg);font-family:var(--mono);font-weight:600}

  /* ---------- layout ---------- */
  .wrap{display:grid;grid-template-columns:296px 1fr;height:calc(100vh - var(--head))}
  aside{background:var(--surface2);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0 24px}
  .grouphd{display:flex;align-items:center;gap:8px;padding:14px 18px 7px;position:sticky;top:0;
    background:linear-gradient(180deg,var(--surface2) 70%,transparent);z-index:1}
  .grouphd .name{font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
  .grouphd .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1px 7px}
  .lvl{display:flex;align-items:center;gap:11px;margin:2px 10px;padding:9px 11px;border-radius:9px;cursor:pointer;
    transition:background .13s,transform .13s;position:relative}
  .lvl:hover{background:#111c28}
  .lvl.active{background:linear-gradient(90deg,#12243a,#0f1927)}
  .lvl.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:3px;
    background:linear-gradient(var(--blue),var(--green));box-shadow:0 0 10px rgba(90,162,255,.6)}
  .lvl .ddot{width:8px;height:8px;border-radius:50%;flex:none}
  .lvl .num{font-family:var(--mono);font-size:11px;color:var(--faint);width:20px;flex:none}
  .lvl .ttl{flex:1;font-size:13px;font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lvl .stat{font-size:13px;flex:none;width:16px;text-align:center}
  .lvl.locked{opacity:.42;cursor:not-allowed}
  .lvl.locked .ttl{color:var(--faint);font-weight:400}
  .lvl.completed .ttl{color:var(--green)}
  .d-intro{background:var(--blue)} .d-easy{background:var(--green)}
  .d-medium{background:var(--amber)} .d-hard{background:var(--orange)} .d-expert{background:var(--red)}

  /* ---------- work area ---------- */
  .workarea{display:flex;min-width:0;height:100%}
  .leftpane{flex:0 0 47%;min-width:360px;display:flex;flex-direction:column;overflow:hidden}
  .leftpane.full{flex:1 1 auto}
  .leftscroll{flex:1;overflow-y:auto;padding:26px 28px 20px}
  .divider{flex:0 0 8px;cursor:col-resize;position:relative;background:var(--surface2)}
  .divider::before{content:"";position:absolute;inset:0 3px;background:var(--line);border-radius:3px;transition:background .15s}
  .divider:hover::before,.divider.drag::before{background:var(--blue)}
  .divider.hidden{display:none}

  /* ---------- card ---------- */
  .card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    box-shadow:var(--shadow);overflow:hidden;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .cardtop{padding:20px 22px 18px;background:radial-gradient(120% 100% at 0% 0%,#14273c,#0d141d);
    border-bottom:1px solid var(--line);position:relative}
  .tags{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tag{font-size:10.5px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;
    border-radius:20px;padding:3px 10px;border:1px solid var(--line2)}
  .tag.lvlno{font-family:var(--mono);color:var(--blue);background:rgba(90,162,255,.1);border-color:rgba(90,162,255,.3)}
  .tag.grp{color:var(--muted);background:var(--surface3)}
  .tag.status{color:var(--amber);background:rgba(255,207,92,.09);border-color:rgba(255,207,92,.28)}
  .tag.status.completed{color:var(--green);background:rgba(63,221,151,.1);border-color:rgba(63,221,151,.3)}
  .pilldiff{font-size:10.5px;font-weight:700;letter-spacing:.5px;border-radius:20px;padding:3px 11px;display:inline-flex;align-items:center;gap:6px}
  .pilldiff .ddot{width:7px;height:7px;border-radius:50%}
  .p-intro{color:var(--blue);background:rgba(90,162,255,.12)}
  .p-easy{color:var(--green);background:rgba(63,221,151,.12)}
  .p-medium{color:var(--amber);background:rgba(255,207,92,.12)}
  .p-hard{color:var(--orange);background:rgba(255,159,69,.12)}
  .p-expert{color:var(--red);background:rgba(255,107,107,.12)}
  .cardtop h2{margin:0;font-size:23px;font-weight:700;letter-spacing:-.2px}
  .cardtop .concept{margin-top:3px;color:var(--muted);font-size:12.5px}

  .sec{padding:18px 22px;border-bottom:1px solid #17222f}
  .sec:last-child{border-bottom:0}
  .sec h3{margin:0 0 11px;font-size:10.5px;font-weight:700;letter-spacing:1.3px;color:var(--faint);text-transform:uppercase}
  .task{font-size:14.5px;color:#eef4fb;background:var(--surface3);border:1px solid var(--line);
    border-left:3px solid var(--blue);border-radius:8px;padding:13px 15px}
  .files{display:flex;flex-wrap:wrap;gap:8px}
  .fchip{font-family:var(--mono);font-size:12px;color:var(--green);background:#0b1a14;
    border:1px solid #1c3a2b;border-radius:7px;padding:6px 11px}
  .runline{margin-top:12px;display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;
    background:#0a0f16;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--muted)}
  .runline .prompt{color:var(--green)} .runline code{color:var(--blue)}
  .runline .cp{margin-left:auto;cursor:pointer;color:var(--faint);border:1px solid var(--line);border-radius:6px;
    padding:2px 8px;font-size:11px;transition:.13s}
  .runline .cp:hover{color:var(--fg);border-color:var(--blue)}

  .hints{display:flex;flex-direction:column;gap:8px}
  .hintrow{border:1px solid var(--line);border-radius:9px;background:var(--surface3);overflow:hidden}
  .hintq{display:flex;align-items:center;gap:11px;padding:11px 13px;cursor:pointer;font-size:13px;color:var(--muted);
    transition:background .13s}
  .hintq:hover{background:#111b26}
  .hintq .idx{font-family:var(--mono);font-size:11px;color:var(--amber);background:rgba(255,207,92,.1);
    border:1px solid rgba(255,207,92,.25);border-radius:6px;width:22px;height:22px;display:grid;place-items:center;flex:none}
  .hintq .chev{margin-left:auto;transition:transform .18s;color:var(--faint)}
  .hintrow.open .chev{transform:rotate(90deg)}
  .hinta{max-height:0;overflow:hidden;transition:max-height .22s ease;color:#e9e2c8;font-size:13px}
  .hintrow.open .hinta{max-height:200px}
  .hinta div{padding:0 15px 13px 46px;border-top:1px solid #1a2530;padding-top:11px}

  .flagrow{display:flex;gap:10px}
  .flagrow input{flex:1;font-family:var(--mono);font-size:14px;color:var(--fg);background:#080d13;
    border:1px solid var(--line2);border-radius:9px;padding:12px 14px;transition:border .15s,box-shadow .15s}
  .flagrow input::placeholder{color:var(--faint)}
  .flagrow input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(90,162,255,.15)}
  .btn{font-family:var(--ui);font-weight:600;font-size:13px;cursor:pointer;border-radius:9px;border:1px solid var(--line2);
    background:var(--surface);color:var(--fg);padding:0 18px;transition:.14s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--blue)}
  .btn.primary{background:linear-gradient(135deg,#12402c,#0f2e3f);border-color:#1e6b47;color:var(--green)}
  .btn.primary:hover{background:linear-gradient(135deg,#154d34,#123a4f);box-shadow:0 0 16px rgba(63,221,151,.18)}
  .msg{margin-top:13px;font-size:13.5px;min-height:20px;font-weight:500;display:flex;align-items:center;gap:8px}
  .msg.ok{color:var(--green)} .msg.bad{color:var(--red)}
  .locked-note{padding:60px 22px;text-align:center;color:var(--faint)}
  .locked-note .big{font-size:34px;margin-bottom:10px}

  footer{display:flex;align-items:center;gap:14px;padding:11px 24px;border-top:1px solid var(--line);
    background:var(--surface2)}
  footer .plabel{font-size:11px;color:var(--faint);letter-spacing:.4px}
  .pbar{flex:1;max-width:280px;height:7px;background:#0a0f16;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
  .pbar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green));
    box-shadow:0 0 10px rgba(63,221,151,.4);transition:width .5s ease}
  .pcount{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .btn.ghost{padding:7px 14px;border-color:var(--line)}
  .btn.reset{margin-left:auto;color:#ff9b9b;border-color:#4a1f1f;background:#1c1113}
  .btn.reset:hover{border-color:var(--red)}

  /* ---------- terminal ---------- */
  .rightpane{flex:1;min-width:300px;display:flex;flex-direction:column;background:#05080c;overflow:hidden}
  .rightpane.hidden{display:none}
  .termbar{height:38px;display:flex;align-items:center;gap:10px;padding:0 12px;
    background:linear-gradient(180deg,#0e151e,#0a0f16);border-bottom:1px solid var(--line)}
  .traffic{display:flex;gap:7px}
  .traffic i{width:11px;height:11px;border-radius:50%;display:block}
  .traffic .r{background:#ff5f57} .traffic .y{background:#febc2e} .traffic .g{background:#28c840}
  .termtitle{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .termtitle b{color:var(--fg)}
  .termact{margin-left:auto;display:flex;gap:6px}
  .termact a,.termact button{font-family:var(--ui);font-size:11px;color:var(--muted);text-decoration:none;
    border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;background:transparent;transition:.13s}
  .termact a:hover,.termact button:hover{color:var(--fg);border-color:var(--blue)}
  #term{flex:1;width:100%;border:0;background:#000}
  /* floating reopen button when terminal collapsed */
  .reopen{position:fixed;right:18px;bottom:64px;z-index:9;display:none;align-items:center;gap:8px;
    font-family:var(--ui);font-weight:600;font-size:12.5px;color:var(--fg);cursor:pointer;
    background:linear-gradient(135deg,#12293f,#0f2036);border:1px solid var(--line2);border-radius:24px;
    padding:10px 16px;box-shadow:var(--shadow)}
  .reopen:hover{border-color:var(--blue)}
  .reopen.show{display:inline-flex}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🔐</div>
    <div><h1>Cryptography Wargame</h1><div class="sub">CyberRange · 21 levels</div></div>
  </div>
  <div class="spacer"></div>
  <div class="ring">
    <svg width="38" height="38" viewBox="0 0 38 38">
      <circle cx="19" cy="19" r="16" fill="none" stroke="#1b2836" stroke-width="4"/>
      <circle id="ringFill" cx="19" cy="19" r="16" fill="none" stroke="url(#g)" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="100.5" stroke-dashoffset="100.5"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5aa2ff"/><stop offset="1" stop-color="#3fdd97"/></linearGradient></defs>
    </svg>
    <div class="lbl"><b id="ringNum">0</b> / {{ max_level + 1 }}</div>
  </div>
  <div class="chip"><span class="dot"></span> student <b>{{ student }}</b></div>
</header>

<div class="wrap">
  <aside id="sidebar"></aside>
  <section class="workarea">
    <div class="leftpane" id="leftpane">
      <div class="leftscroll"><div id="cardHost"></div></div>
      <footer>
        <span class="plabel">PROGRESS</span>
        <div class="pbar"><span id="barFill"></span></div>
        <span class="pcount" id="pcount">0 / 21</span>
        <button class="btn reset" onclick="resetLab()">Reset lab</button>
      </footer>
    </div>
    <div class="divider" id="divider" title="drag to resize"></div>
    <div class="rightpane" id="rightpane">
      <div class="termbar">
        <span class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></span>
        <span class="termtitle"><b>student-env</b> — bash · <span id="termhost"></span></span>
        <span class="termact">
          <a id="termpop" href="#" target="_blank" rel="noopener">⤢ Pop-out</a>
          <button onclick="toggleTerm(false)">✕ Hide</button>
        </span>
      </div>
      <iframe id="term" title="student terminal"></iframe>
    </div>
  </section>
</div>
<button class="reopen" id="reopen" onclick="toggleTerm(true)">▟ Open terminal</button>

<script>
const MAX = {{ max_level }};
let selected = 0, prog = null;
const DIFF_LABEL = {intro:'Intro',easy:'Easy',medium:'Medium',hard:'Hard',expert:'Expert'};
const api = (p,opt) => fetch(p,opt).then(r=>r.json());
const statIcon = s => s==='completed'?'✓':s==='current'?'▸':s==='locked'?'🔒':'○';

/* embedded terminal (ttyd on student-env:7681) */
const TERM_URL = `${location.protocol}//${location.hostname}:7681/`;
document.getElementById('term').src = TERM_URL;
document.getElementById('termpop').href = TERM_URL;
document.getElementById('termhost').textContent = `${location.hostname}:7681`;

function toggleTerm(show){
  document.getElementById('rightpane').classList.toggle('hidden',!show);
  document.getElementById('divider').classList.toggle('hidden',!show);
  document.getElementById('leftpane').classList.toggle('full',!show);
  document.getElementById('reopen').classList.toggle('show',!show);
}

/* draggable divider */
(function(){
  const wa=document.querySelector('.workarea'),lp=document.getElementById('leftpane'),dv=document.getElementById('divider');
  let drag=false;
  dv.addEventListener('mousedown',e=>{drag=true;dv.classList.add('drag');document.getElementById('term').style.pointerEvents='none';e.preventDefault();});
  window.addEventListener('mouseup',()=>{if(drag){drag=false;dv.classList.remove('drag');document.getElementById('term').style.pointerEvents='auto';}});
  window.addEventListener('mousemove',e=>{if(!drag)return;const r=wa.getBoundingClientRect();
    let px=Math.max(360,Math.min(r.width-320,e.clientX-r.left));lp.style.flexBasis=px+'px';});
})();

async function refresh(){
  prog = await api('/api/progress');
  const groups=[];const byGroup={};
  prog.levels.forEach(l=>{ if(!byGroup[l.group]){byGroup[l.group]=[];groups.push(l.group);} byGroup[l.group].push(l); });
  const sb=document.getElementById('sidebar'); sb.innerHTML='';
  groups.forEach(g=>{
    const done=byGroup[g].filter(l=>l.status==='completed').length;
    const hd=document.createElement('div'); hd.className='grouphd';
    hd.innerHTML=`<span class="name">${g}</span><span class="cnt">${done}/${byGroup[g].length}</span>`;
    sb.appendChild(hd);
    byGroup[g].forEach(l=>{
      const d=document.createElement('div');
      d.className=`lvl ${l.status}`+(l.n===selected?' active':'');
      d.onclick=()=>{ if(l.status!=='locked'){openLevel(l.n);} };
      d.innerHTML=`<span class="ddot d-${l.diff}"></span>
        <span class="num">${String(l.n).padStart(2,'0')}</span>
        <span class="ttl">${l.title}</span><span class="stat">${statIcon(l.status)}</span>`;
      sb.appendChild(d);
    });
  });
  const done=prog.completed.length, frac=done/(MAX+1);
  document.getElementById('ringNum').textContent=done;
  document.getElementById('ringFill').style.strokeDashoffset=(100.5*(1-frac)).toFixed(1);
  document.getElementById('barFill').style.width=`${frac*100}%`;
  document.getElementById('pcount').textContent=`${done} / ${MAX+1}`;
}

async function openLevel(n){
  selected=n;
  const data=await api('/api/level/'+n);
  const host=document.getElementById('cardHost');
  if(data.error){
    host.innerHTML=`<div class="card"><div class="locked-note"><div class="big">🔒</div>
      This level is locked.<br>Finish the previous level to unlock it.</div></div>`;
    refresh(); return;
  }
  let hints='';
  for(let i=0;i<data.hint_count;i++){
    hints+=`<div class="hintrow" id="hr-${i}">
      <div class="hintq" onclick="showHint(${n},${i})"><span class="idx">${i+1}</span>
        <span>Reveal hint ${i+1}</span><span class="chev">›</span></div>
      <div class="hinta"><div id="ht-${i}">…</div></div></div>`;
  }
  const statusCls = data.status==='completed'?'completed':'';
  host.innerHTML=`
    <div class="card">
      <div class="cardtop">
        <div class="tags">
          <span class="tag lvlno">Level ${String(n).padStart(2,'0')}</span>
          <span class="pilldiff p-${data.diff}"><span class="ddot d-${data.diff}"></span>${DIFF_LABEL[data.diff]}</span>
          <span class="tag grp">${data.group}</span>
          <span class="tag status ${statusCls}">${data.status}</span>
        </div>
        <h2>${data.title}</h2>
        <div class="concept">${data.concept}</div>
      </div>
      <div class="sec"><h3>Task</h3><div class="task">${data.task}</div></div>
      <div class="sec">
        <h3>Files &amp; workspace</h3>
        <div class="files">${data.files.map(f=>`<span class="fchip">${f}</span>`).join('')}</div>
        <div class="runline"><span class="prompt">$</span> <code id="cdCmd">cd ${data.path}</code>
          <span class="cp" onclick="copyCmd()">Copy</span></div>
      </div>
      <div class="sec"><h3>Hints — optional</h3><div class="hints">${hints||'<span style="color:var(--faint)">No hints for this level.</span>'}</div></div>
      <div class="sec">
        <h3>Submit flag</h3>
        <div class="flagrow">
          <input id="flagIn" placeholder="CRYPTO{...}" autocomplete="off" spellcheck="false"
            onkeydown="if(event.key==='Enter')submitFlag(${n})">
          <button class="btn primary" onclick="submitFlag(${n})">Submit ↵</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>`;
  refresh();
}

async function showHint(n,i){
  const row=document.getElementById('hr-'+i);
  const open=row.classList.toggle('open');
  if(open && document.getElementById('ht-'+i).textContent==='…'){
    const d=await api(`/api/hint/${n}/${i}`);
    document.getElementById('ht-'+i).textContent=d.hint;
  }
}
function copyCmd(){ navigator.clipboard?.writeText(document.getElementById('cdCmd').textContent); }

async function submitFlag(n){
  const flag=document.getElementById('flagIn').value.trim();
  const msg=document.getElementById('msg');
  if(!flag){msg.className='msg bad';msg.textContent='⚠ Enter a flag first.';return;}
  const r=await api('/api/submit-flag',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({level:n,flag})});
  if(r.correct){
    msg.className='msg ok';
    msg.textContent='✓ '+r.message+(r.unlocked!=null?`  Level ${String(r.unlocked).padStart(2,'0')} unlocked.`:'');
    await refresh();
    if(r.unlocked!=null) setTimeout(()=>openLevel(r.unlocked),750);
  }else{
    msg.className='msg bad';
    msg.textContent='✗ '+(r.message||r.error||'Incorrect.');
  }
}

async function resetLab(){
  if(!confirm('Reset all progress and re-lock every level?'))return;
  await api('/api/reset',{method:'POST'});
  selected=0; await refresh(); openLevel(0);
}

refresh().then(()=>openLevel(0));
</script>
