<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ title }} | Command Line Lab</title>
<style>
  :root {
    --bg: #F8F9FA;
    --panel: #ffffff;
    --panel-border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --accent: #0052CC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, sans-serif;
  }
  .navbar {
    padding: 14px 28px;
    border-bottom: 1px solid var(--panel-border);
    background: #ffffff;
    box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  }
  .navbar a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  .navbar a:hover { color: var(--accent); }

  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 32px; max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } .toc { display: none; } }

  .toc { position: sticky; top: 24px; align-self: start; font-size: 0.85rem; }
  .toc ul { list-style: none; padding-left: 0; }
  .toc ul ul { padding-left: 14px; }
  .toc a { color: var(--text-muted); display: block; padding: 4px 0; font-weight: 500; }
  .toc a:hover { color: var(--accent); }

  .content h1, .content h2, .content h3 { color: var(--text); font-weight: 800; }
  .content h1 { border-bottom: 1px solid var(--panel-border); padding-bottom: 10px; }
  .content p, .content li { color: #334155; line-height: 1.7; font-size: 0.95rem; }
  .content code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; font-family: monospace; color: #0f172a; }

  .content pre {
    position: relative; background: #ffffff; border: 1px solid var(--panel-border);
    border-radius: 8px; padding: 16px; overflow-x: auto; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05);
  }
  .content pre code { background: none; padding: 0; color: inherit; }
  .copy-btn {
    position: absolute; top: 8px; right: 8px; background: #f1f5f9; color: var(--text-muted);
    border: 1px solid var(--panel-border); border-radius: 6px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; font-weight: 600;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--accent); }

  blockquote { margin: 16px 0; padding: 12px 16px; border-left: 4px solid var(--panel-border); background: #f8fafc; border-radius: 0 6px 6px 0; color: #475569; }
  blockquote.callout-note { border-left-color: #4a90e2; }
  blockquote.callout-tip { border-left-color: #16a34a; }
  blockquote.callout-warning { border-left-color: #f59e0b; }

  table { border-collapse: collapse; width: 100%; margin: 16px 0; }
  th, td { border: 1px solid var(--panel-border); padding: 8px 12px; text-align: left; font-size: 0.9rem; }
  th { background: #f1f5f9; color: var(--text); font-weight: 700; }

  .progress-rail { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); width: 0%; z-index: 10; }
</style>
</head>
<body>

<div class="progress-rail" id="progress-rail"></div>

<nav class="navbar"><a href="/">&larr; Back to Command Line Lab</a></nav>

<div class="layout">
  <aside class="toc" id="toc"></aside>
  <article class="content" id="content">
    {{ content | safe }}
  </article>
</div>

<script>
  // Build sticky TOC from headings
  const content = document.getElementById("content");
  const toc = document.getElementById("toc");
  const headings = content.querySelectorAll("h2, h3");
  if (headings.length) {
    const list = document.createElement("ul");
    headings.forEach((h, i) => {
      if (!h.id) h.id = "section-" + i;
      const li = document.createElement("li");
      if (h.tagName === "H3") li.style.paddingLeft = "12px";
      const a = document.createElement("a");
      a.href = "#" + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      list.appendChild(li);
    });
    toc.appendChild(list);
  }

  // Copy-command buttons on code blocks
  document.querySelectorAll("pre").forEach((pre) => {
    const btn = document.createElement("button");
    btn.className = "copy-btn";
    btn.textContent = "Copy";
    btn.addEventListener("click", () => {
      navigator.clipboard.writeText(pre.innerText.replace(/Copy$/, "").trim());
      btn.textContent = "Copied!";
      setTimeout(() => (btn.textContent = "Copy"), 1500);
    });
    pre.appendChild(btn);
  });

  // Reading progress rail
  window.addEventListener("scroll", () => {
    const h = document.documentElement;
    const scrolled = (h.scrollTop) / (h.scrollHeight - h.clientHeight) * 100;
    document.getElementById("progress-rail").style.width = scrolled + "%";
  });
</script>

</body>
</html>
