<VirtualHost *:80>
    ServerName techcorp.internal
    DocumentRoot /var/www/html

    # Intentional: Expose server info (ServerTokens Full)
    ServerSignature On

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Hidden admin path (discovered via directory bruteforce - Module 3)
    Alias /internal /var/www/internal
    <Directory /var/www/internal>
        Options Indexes
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
