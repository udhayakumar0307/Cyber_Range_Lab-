<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SecureGuard Module Guide</title>
    <style>
        body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', sans-serif; padding: 40px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background: #161b22; border: 1px solid #30363d; padding: 30px; border-radius: 8px; }
        code { background: #30363d; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #ff7b72; }
        pre code { display: block; padding: 15px; overflow-x: auto; color: #c9d1d9; }
        h1, h2, h3 { color: #3fb950; margin-top: 24px; margin-bottom: 16px; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container" id="content">Loading guide...</div>

    <script>
        // Fetch the raw markdown file from your static mount point
        fetch('/static/modules/{{ filename }}')
            .then(res => res.text())
            .then(text => {
                document.getElementById('content').innerHTML = marked.parse(text);
            });
    </script>
</body>
</html>
