AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudCorp AWS Odyssey - Level 3: Serverless Lambda, SSM & Secrets Manager'

Parameters:
  StudentSessionId:
    Type: String
    Default: 'student'

Resources:
  KMSMasterKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'CloudCorp Customer Managed KMS Key'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: 'EnableIAMUserPermissions'
            Effect: 'Allow'
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  KMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/cloudcorp-key-${StudentSessionId}'
      TargetKeyId: !Ref KMSMasterKey

  MasterSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'cloudcorp/prod/db_password_${StudentSessionId}'
      Description: 'CloudCorp Production Database Password'
      SecretString: '{"username":"cloudcorp_admin","password":"SuperSecretP@ssword2026!"}'

  SSMHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/cloudcorp/prod/db_host_${StudentSessionId}'
      Type: 'String'
      Value: 'db.prod.cloudcorp.internal'

Outputs:
  SecretArn:
    Value: !Ref MasterSecret
  KmsKeyId:
    Value: !Ref KMSMasterKey
